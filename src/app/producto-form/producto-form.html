<h2>{{ titulo }}</h2>

<form (ngSubmit)="guardar()">
  <div class="mb-3">
    <label class="form-label">Nombre del Producto</label>
    <input type="text" class="form-control" [(ngModel)]="producto.nombreProducto" name="nombreProducto" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Monto Máximo</label>
    <input type="number" class="form-control" [(ngModel)]="producto.montoMaximo" name="montoMaximo" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Tasa de Interés (%)</label>
    <input type="number" step="0.01" class="form-control" [(ngModel)]="producto.tasaInteres" name="tasaInteres" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Tipo Producto (1=Crédito, 2=TarjetaCrédito)</label>
    <input type="number" class="form-control" [(ngModel)]="producto.tipoProductoId" name="tipoProductoId" required>
  </div>

  <button type="submit" class="btn btn-success">Guardar</button>
  <a routerLink="/productos" class="btn btn-secondary ms-2">Cancelar</a>
</form>
