<div class="mb-3">
  <button class="btn btn-primary" (click)="irAlFormulario()">+ Nuevo Usuario</button>
</div>

<h2>Listado de Usuarios</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Rol</th>
      <th>Teléfono</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let usuario of usuarios">
      <td>{{ usuario.id }}</td>
      <td>{{ usuario.nombre }}</td>
      <td>{{ usuario.email }}</td>
      <td>{{ usuario.rol }}</td>
      <td>{{ usuario.telefono }}</td>
      <td>
        <button class="btn btn-warning btn-sm me-1" (click)="editarUsuario(usuario.id)">Editar</button>
        <button class="btn btn-danger btn-sm" (click)="eliminarUsuario(usuario.id)">Eliminar</button>
      </td>
      </tr>
  </tbody>
</table>
