<h2>{{ titulo }}</h2>

<form (ngSubmit)="guardar()">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control" [(ngModel)]="usuario.nombre" name="nombre" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" [(ngModel)]="usuario.email" name="email" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select class="form-control" [(ngModel)]="usuario.rol" name="rol" required>
      <option value="">Seleccione un rol</option>
      <option value="Asesor">Asesor</option>
      <option value="Analista">Analista</option>
      <option value="Administrador">Administrador</option>
      <option value="Financiero">Financiero</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Teléfono</label>
    <input type="text" class="form-control" [(ngModel)]="usuario.telefono" name="telefono">
  </div>

  <button type="submit" class="btn btn-success">Guardar</button>
  <a routerLink="/usuarios" class="btn btn-secondary ms-2">Cancelar</a>
</form>
